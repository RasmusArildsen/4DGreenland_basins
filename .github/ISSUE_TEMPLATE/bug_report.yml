name: Bug report
description: Report a reproducible workflow or product problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the workflow. Do not attach restricted input data.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target
      placeholder: hybrid_500m
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the command, relevant configuration, and smallest reproducible example.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      placeholder: Output of git rev-parse HEAD
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python, GRASS GIS, and GDAL versions.
    validations:
      required: true
