[run]
# One target is selected per run. submit_all_targets.sh rewrites these values
# in a temporary per-job config for all six standard targets.
dem_mode = "surface"       # "surface" | "bed" | "hybrid"
dem_res_m = 100            # 100 | 500
n_members = 500
start_i = 1
seed_base = 0
k_min = 0.8
k_max = 1.0

[grass]
# Leave gisbase empty when GRASS is discoverable on PATH.
gisbase = ""
location = "dem_loc"
mapset_prefix = "MC_WORK"
ensure_addons = ["r.stream.extract"]
gisdbase = "/work3/ralor/grassdata"

[hydrology]
stream_threshold_100m = 5000
stream_threshold_500m = 200
corr_pix_100m = 5
corr_pix_500m = 5
do_fill_dir = true
watershed_memory = 600
watershed_lowmem = true

[inputs]
# Replace these paths with local/HPC paths to the required input datasets.
ice_mask = "/path/to/02-PROMICE-2022-IceMask-polygon-v3.gpkg"

dem_100m = "/path/to/arcticdem_mosaic_100m_v4.1_dem_clipped.tif"
var_100m = "/path/to/arcticdem_mosaic_100m_v4.1_mad_or_variance.tif"
bed_100m = "/path/to/bedmachine_100m.tif"
bed_err_100m = "/path/to/bedmachine_errbed_100m.tif"
bed_err_is_variance_100m = false

dem_500m = "/path/to/arcticdem_500m_dem.tif"
var_500m = "/path/to/arcticdem_500m_mad_or_variance.tif"
bed_500m = "/path/to/bedmachine_500m.tif"
bed_err_500m = "/path/to/bedmachine_errbed_500m.tif"
bed_err_is_variance_500m = false

# Surface-to-bed transition mask used by hybrid routing.
surf_mask_2000 = "/path/to/Ice_sheet_lake_boundary.tif"

[outputs]
surface_dir_100m = "/work3/ralor/output/surf_100m"
bed_dir_100m = "/work3/ralor/output/bed_100m"
hybrid_dir_100m = "/work3/ralor/output/hybrid_100m"

surface_dir_500m = "/work3/ralor/output/surf_500m"
bed_dir_500m = "/work3/ralor/output/bed_500m"
hybrid_dir_500m = "/work3/ralor/output/hybrid_500m"

save_surface_dem = false
save_bed_dem = false
save_phi_or_hybrid_dem = false

[postprocess]
# "member" is the production workflow: merge every member first, then derive
# final products from the merged ensemble.
merge_strategy = "member"
merge_output_subdir = "merged_members"
merge_min_basin_km2 = 250.0
merge_do_exclaves = true
merge_max_exclave_iters = 3

p_stable_pixel = 0.75
p_min_div = 0.00

# Reference-layer construction for final products.
reference_mode = "iterative"
reference_iterations = 2
reference_ref_index = 0
reference_chunk_rows = 32
reference_raster = ""
