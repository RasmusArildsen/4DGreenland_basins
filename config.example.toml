[run]
# Select one target per run. Use run_all_targets.py to run the six standard
# target combinations from this same template.
dem_mode = "surface"       # "surface" | "bed" | "hybrid"
dem_res_m = 100            # 100 | 500
n_members = 500
seed_base = 0
k_min = 0.8
k_max = 1.0

[grass]
location = "dem_loc"
mapset_prefix = "MC_WORK"
ensure_addons = ["r.stream.extract"]
gisdbase = "grassdata"

[hydrology]
stream_threshold_100m = 5000 # 50 km2
stream_threshold_500m = 200  # 50 km2
corr_pix_100m = 5
corr_pix_500m = 5
do_fill_dir = true
watershed_memory = 600
watershed_lowmem = true

[inputs]
# Replace these paths with the datasets available in your environment.
ice_mask = "data/input/02-PROMICE-2022-IceMask-polygon-v3.gpkg"

dem_100m = "data/input/arcticdem_mosaic_100m_v4.1_dem_clipped.tif"
var_100m = "data/input/arcticdem_mosaic_100m_v4.1_mad_or_variance.tif"
bed_100m = "data/input/bedmachine_100m.tif"
bed_err_100m = "data/input/bedmachine_errbed_100m.tif"
bed_err_is_variance_100m = false

dem_500m = "data/input/arcticdem_500m_dem.tif"
var_500m = "data/input/arcticdem_500m_mad_or_variance.tif"
bed_500m = "data/input/bedmachine_500m.tif"
bed_err_500m = "data/input/bedmachine_errbed_500m.tif"
bed_err_is_variance_500m = false

# Surface-to-bed transition mask used by hybrid routing.
surf_mask_2000 = "data/input/Ice_sheet_lake_boundary.tif"

[outputs]
surface_dir_100m = "outputs/surf_100m"
bed_dir_100m = "outputs/bed_100m"
hybrid_dir_100m = "outputs/hybrid_100m"

surface_dir_500m = "outputs/surf_500m"
bed_dir_500m = "outputs/bed_500m"
hybrid_dir_500m = "outputs/hybrid_500m"

# Set true only when flow-direction and stream rasters are needed for inspection.
save_member_diagnostics = false

[references]
# Each reference is Version_0, already merged to the configured minimum basin
# size and numbered 1..N from north around the coast clockwise.
surf_100m = "data/reference/basins_surf_100m_version0_merged_min250km2.tif"
bed_100m = "data/reference/basins_bed_100m_version0_merged_min250km2.tif"
hybrid_100m = "data/reference/basins_hybrid_100m_version0_merged_min250km2.tif"
surf_500m = "data/reference/basins_surf_500m_version0_merged_min250km2.tif"
bed_500m = "data/reference/basins_bed_500m_version0_merged_min250km2.tif"
hybrid_500m = "data/reference/basins_hybrid_500m_version0_merged_min250km2.tif"

[postprocess]
# Apply the same minimum to Version_0 and every ensemble member.
minimum_basin_km2 = 250.0
merge_do_exclaves = true
merge_max_exclave_iters = 12

chunk_rows = 128
stable_divide_probability = 0.80
probability_chunk_rows = 4
# Rows processed at once when creating the reviewed final delivery.
delivery_chunk_rows = 32
