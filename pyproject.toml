[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "greenland-drainage-basins"
version = "0.1.0"
description = "Ensemble delineation and uncertainty analysis of Greenland hydrological drainage basins"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Rasmus L. Arildsen"},
  {name = "Anna K. Deichmann"},
]
dependencies = [
  "numpy>=1.26,<3",
  "rasterio>=1.3,<2",
  "geopandas>=0.14,<2",
  "shapely>=2.0,<3",
  "matplotlib>=3.8,<3.11",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.7,<1"]

[project.scripts]
greenland-outlet = "outlet_analysis:main"

[tool.setuptools]
py-modules = [
  "basin_core",
  "ensemble_merge",
  "ensemble_products",
  "ensemble_runner",
  "final_delivery",
  "outlet_analysis",
  "reference",
  "run_all_targets",
  "run_ensemble",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
include = [
  "basin_core.py",
  "ensemble_merge.py",
  "ensemble_products.py",
  "ensemble_runner.py",
  "final_delivery.py",
  "outlet_analysis.py",
  "reference.py",
  "run_all_targets.py",
  "run_ensemble.py",
  "tests/**/*.py",
]
